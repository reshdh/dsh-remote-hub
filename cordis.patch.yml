# dsh-remote-hub — bundle patch layer（一个包，一行 insert）
#
# 当 profile 的 dsh.profile.bundles 列了这个包时整层生效
# （`dsh plugin --profile web add dsh-remote-hub` 会自动写进去）。
# 随包自带，用户不需要在自己的 profile patch 里手挂任何一行。
#
# 注意：本插件与 dsh-zen-remote 共用 `zenRemote` 服务名与 `/_dsh/zen-remote/*`
# 传输协议以无缝兼容既有配对，安装启用前请先停用或移除 dsh-zen-remote。
- insert:
    # 界面半边（浏览器端 app 外壳 + 桌面端工作区分栏切换器 + 跨机 @ 引用增强）
    # + host 侧路由（附件上传 / 客户端配置 / 远程目录管理 / 会话引用桥接）
    # + 按角色加载的网关与推送子插件。
    - id: dsh-remote-hub
      name: dsh-remote-hub
