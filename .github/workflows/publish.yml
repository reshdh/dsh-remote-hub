# GitHub-native CI & Release pipeline (no npmjs.com account required):
# - On push to main / PR: build + typecheck + full test suite.
# - On tag push (v*): build + typecheck + test + pack .tgz + create/upload GitHub Release assets.
name: ci-and-release

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm verify

      - run: pnpm test

      - name: Pack and publish GitHub Release tarball
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(node -p "require('./package.json').version")"
          pkg="v${ver}"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME != package.json $pkg" >&2
            exit 1
          fi
          section=$(awk -v ver="${ver}" '
            $0 ~ "^## " ver "($|（)" { grab = 1; next }
            /^## / { grab = 0 }
            grab { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}')
          if [ -z "$section" ]; then
            echo "CHANGELOG.md missing section for ${ver}" >&2
            exit 1
          fi
          npm pack
          tgz="dsh-remote-hub-${ver}.tgz"
          cp "$tgz" dsh-remote-hub.tgz
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$tgz" dsh-remote-hub.tgz --clobber
          else
            printf '%s\n' "$section" > release-body.md
            gh release create "$GITHUB_REF_NAME" "$tgz" dsh-remote-hub.tgz \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-body.md
          fi
